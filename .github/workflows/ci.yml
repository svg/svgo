name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with: &setup-node-config
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with: *setup-node-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:types
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with: *setup-node-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm spellcheck
  test:
    name: test - ${{ matrix.os }} - Node.js v${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
          - 20
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g corepack@0.34.5 --force
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:bundles
  test-runtime:
    name: test runtime - ${{ matrix.os }} - Node.js v${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 16
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g corepack@0.34.5 --force
      - run: corepack enable
      - uses: actions/setup-node@v6
        with: *setup-node-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bundles
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node ./test/svgo.cjs
